---
layout: default
---
<article class="post">
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tag %} · {{ page.tag }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">{% endif %}
  {{ content }}
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← All posts</a></p>
